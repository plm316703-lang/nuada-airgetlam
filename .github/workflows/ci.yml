name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  spring:
    runs-on: ubuntu-latest

    # 테스트가 실제 MySQL에 접속하므로 잡 옆에 MySQL을 띄움. 잡이 끝나면 버려져 초기화가 필요 없음
    services:
      mysql:
        # docker-compose.yml(시연·배포)과 같은 버전으로 맞춤
        image: mysql:8.4
        env:
          MYSQL_DATABASE: nuada_ci
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_test_password
          MYSQL_ROOT_PASSWORD: ci_test_root_password
        ports:
          - 3306:3306
        # MySQL이 접속을 받을 준비가 될 때까지 스텝 시작을 기다리게 함 (부팅 중에 테스트가 붙으면 실패)
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # .env가 없으므로 application.yaml이 읽는 이름 그대로 값을 줌.
    # 공개 저장소라 누구나 보지만, 이 러너 안에서만 쓰이고 사라지는 가짜 값이라 노출돼도 피해가 없음
    env:
      MYSQL_DATABASE: nuada_ci          # 위 services의 MySQL 값과 같아야 접속됨
      MYSQL_USER: ci_user
      MYSQL_PASSWORD: ci_test_password
      JWT_SECRET: ci-test-jwt-secret-not-for-production-0123456789   # 32자 이상이어야 서버가 시작됨
      GATEWAY_API_KEY: ci-test-gateway-key

    steps:
        # 러너는 빈 컴퓨터라 GitHub에 push된 커밋을 받아와야 함
      - name: 코드 받아오기
        uses: actions/checkout@v7
        # build.gradle이 Java 21을 요구함
      - name: Java 21 설치
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'


      #5. gradlew 실행 권한 주기
      #  -> gradlew 실행 권한은 Git에 기록함(100755)이라 별도 스텝 불필요

      # gradlew가 backend-spring 안에 있으므로 그 폴더에서 실행
      - name: 테스트 실행
        working-directory: backend-spring
        run: ./gradlew test

  # Python 쪽은 자동 테스트가 없어서 "문법이 깨졌는지"만 검사 (내 결정: compileall, 설치 불필요)
  # 실행하지 않고 읽기만 하므로 MySQL·설정값이 필요 없음
  python:
    runs-on: ubuntu-latest

    steps:
      # 잡마다 러너가 따로라 코드도 다시 받아와야 함
      - name: 코드 받아오기
        uses: actions/checkout@v7

      # 로컬 개발 환경(conda nuada-bci)과 같은 3.11
      - name: Python 3.11 설치
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # -q: 문제 있는 파일만 출력. 문법 오류가 하나라도 있으면 실패(빨간불)
      - name: 문법 검사
        run: python -m compileall -q ai-server-python
