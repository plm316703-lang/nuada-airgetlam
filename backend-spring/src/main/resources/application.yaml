# 공통 설정 — 비밀번호 같은 민감 정보는 여기에 절대 쓰지 않음
spring:

  applivation:
    name: backend    #애플리케이션 이름


  profiles:
    active: local # 실행할 때 application-local.yml도 함께 읽어오라는 뜻

  jpa:
     open-in-view: false
     hibernate:
        ddl-auto: update #엔티티 클래스를 보고 테일블을 자동 생성/수정(개발용 설정)
     show-sql: true  #실행되는 SQL을 콘솔에 출력(JPA 학습에 아주 유용)
     properties:
      hibernate:
        format_sql: true # 출력되는 SQL을 보기 좋게 줄 바꿈
