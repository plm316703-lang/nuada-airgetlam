<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuada Airgetlám — 보호자</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><b>Nuada Airgetlám</b><span>보호자 화면</span></div>
  <div class="who"><span id="who"></span><button id="logout" type="button">로그아웃</button></div>
</header>
<main>
  <section class="panel">
    <h2>연결된 환자 <small>보기 전용 · 대리 동의는 발표 이후 기능</small></h2>
    <div id="list" class="grid two"></div>
  </section>
</main>
<script src="/js/common.js"></script>
<script>
  const RELATION = { FAMILY: '가족', CAREGIVER: '간병인', OTHER: '기타' };
  (async function () {
    await requireRole(['GUARDIAN']);
    await refresh();
    setInterval(() => refresh().catch(() => {}), 2000);
  })();

  async function refresh() {
    const list = await api('/api/me/guardian/patients');
    const box = document.getElementById('list');
    if (!list.length) { box.replaceChildren(el('p', { class: 'muted' }, '연결된 환자가 없습니다.')); return; }
    box.replaceChildren(...list.map(p => {
      const canvas = el('canvas', { class: 'arm', 'aria-label': `${p.name} 로봇팔` });
      const card = el('div', { class: 'panel' },
        el('h2', {}, `${p.name} `, el('small', {}, `${p.researchCode} · ${RELATION[p.relation] || p.relation}`)),
        canvas,
        el('dl', { class: 'kv', style: 'margin-top:10px' },
          el('dt', {}, '연구 참여'), el('dd', {}, p.participating ? '참여 중' : '참여 중 아님'),
          el('dt', {}, '로봇팔'), el('dd', {}, p.arm ? `${stateName(p.arm.state)} · ${Number(p.arm.angle).toFixed(0)}°` : '세션 없음'),
          p.arm && p.arm.stopReason ? el('dt', {}, '정지 사유') : null,
          p.arm && p.arm.stopReason ? el('dd', {}, p.arm.stopReason) : null));
      requestAnimationFrame(() => drawArm(canvas, p.arm ? p.arm.angle : 90, p.arm ? p.arm.state : 'IDLE'));
      return card;
    }));
  }
</script>
</body>
</html>
