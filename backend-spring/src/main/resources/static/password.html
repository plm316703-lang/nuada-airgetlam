<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuada Airgetlám — 비밀번호 변경</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="login">
  <form class="card" id="form" autocomplete="on">
    <h1>비밀번호 변경</h1>
    <p id="intro">새 비밀번호를 정해 주세요.</p>

    <!-- 비밀번호 관리자 프로그램이 계정을 알아보도록 이메일을 숨은 칸으로 둔다 -->
    <input id="email" type="email" autocomplete="username" hidden>
    <label for="current" id="currentLabel">지금 비밀번호</label>
    <input id="current" type="password" required autocomplete="current-password">
    <label for="next">새 비밀번호</label>
    <input id="next" type="password" required minlength="10" autocomplete="new-password" aria-describedby="rules">
    <label for="again">새 비밀번호 확인</label>
    <input id="again" type="password" required autocomplete="new-password">

    <ul id="rules" class="muted" style="font-size:12px;margin:10px 0 0;padding-left:18px">
      <li>10자 이상 (긴 문장도 좋아요. 예: 띄어쓰기를 넣은 짧은 문장)</li>
      <li>지금(임시) 비밀번호와 달라야 해요</li>
      <li>이메일 앞부분은 넣을 수 없어요</li>
    </ul>

    <button class="primary" type="submit">바꾸기</button>
    <div class="msg" id="msg" role="alert"></div>
    <div class="row" style="margin-top:12px;justify-content:space-between">
      <button id="back" type="button" hidden style="width:auto;margin-top:0">돌아가기</button>
      <button id="logout" type="button" style="width:auto;margin-top:0">로그아웃</button>
    </div>
  </form>
</div>
<script src="/js/common.js"></script>
<script>
  // 이 화면은 requireRole을 쓰지 않는다: 임시 비밀번호 상태에서도 열려야 하는 유일한 화면이기 때문
  let me;
  (async function () {
    me = await api('/api/auth/me');   // 로그인 안 됐으면 api()가 로그인 화면으로 보냄
    document.getElementById('email').value = me.email;
    if (me.mustChangePassword) {
      document.getElementById('intro').textContent =
        `${me.name}님, 처음 로그인하셨어요. 관리자에게 받은 임시 비밀번호를 본인만 아는 비밀번호로 바꿔야 다른 화면을 쓸 수 있어요.`;
      document.getElementById('currentLabel').textContent = '임시 비밀번호';
    } else {
      const back = document.getElementById('back');
      back.hidden = false;
      back.onclick = () => { location.href = me.home; };
    }
  })();

  document.getElementById('logout').onclick = async () => {
    await api('/api/auth/logout', { method: 'POST' }); location.href = '/login.html';
  };

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('msg');
    msg.textContent = '';
    const next = document.getElementById('next').value;
    // 확인 칸 비교는 화면에서만 한다 (오타 방지용). 실제 규칙 검사는 서버가 다시 한다
    if (next !== document.getElementById('again').value) { msg.textContent = '새 비밀번호와 확인이 서로 다릅니다.'; return; }
    try {
      const after = await api('/api/auth/password', { method: 'POST', body: {
        currentPassword: document.getElementById('current').value, newPassword: next,
      }});
      toast('비밀번호를 바꿨습니다.', true);
      setTimeout(() => { location.href = after.home; }, 800);   // 안내를 잠깐 보여 준 뒤 원래 첫 화면으로
    } catch (err) {
      msg.textContent = err.message;
    }
  });
</script>
</body>
</html>
